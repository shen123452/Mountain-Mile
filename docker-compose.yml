services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mountain_mile
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - mountain_mile_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mountain_mile"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mountain_mile_pgdata:
