# 山程生产站点配置 —— 放到服务器 /etc/nginx/conf.d/mountain-mile.conf
#
# 目标机器上已有 default / student-system.conf / shen-ai.xyz.conf 三个站点,
# 本文件只新增一个 server 块,按 server_name 精确匹配,不影响既有站点。
#
# 前端静态文件: /opt/mountain-mile/frontend/dist
# 后端接口:     127.0.0.1:4000 (docker compose 暴露,仅本机)

server {
    listen 80;
    listen [::]:80;
    server_name 118.31.168.1;

    root /opt/mountain-mile/frontend/dist;
    index index.html;

    access_log /var/log/nginx/mountain-mile.access.log;
    error_log  /var/log/nginx/mountain-mile.error.log;

    client_max_body_size 10m;

    # SSE 流式时间线:关闭缓冲,否则前端收不到实时事件
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        chunked_transfer_encoding on;
    }

    # 静态资源:带 hash 的产物长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# ── shen-ai.xyz:HTTP 统一跳 HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name shen-ai.xyz www.shen-ai.xyz;
    return 301 https://$host$request_uri;
}

# ── shen-ai.xyz:HTTPS 主站(复用服务器既有证书,有效期至 2026-10-06)──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shen-ai.xyz www.shen-ai.xyz;

    ssl_certificate /ssl/shen-ai.xyz.pem;
    ssl_certificate_key /ssl/shen-ai.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /opt/mountain-mile/frontend/dist;
    index index.html;

    access_log /var/log/nginx/mountain-mile.access.log;
    error_log  /var/log/nginx/mountain-mile.error.log;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        chunked_transfer_encoding on;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
